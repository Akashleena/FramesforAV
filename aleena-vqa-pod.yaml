apiVersion: v1
kind: Pod
metadata:
  name: aleena-vqa-pod
  namespace: gilpin-lab
spec:
  restartPolicy: Never
  containers:
  - name: aleena-vqa-container
    image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/tensorflow
    command:
      - sh
      - -c
      - |
        pip3 install torch torchvision torchaudio && \
        jupyter lab --NotebookApp.token=aleena --ip=0.0.0.0 --allow-root --no-browser && \
        sleep infinity
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: "20Gi"
        nvidia.com/gpu: 1
    volumeMounts:
      - name: aleena-vqa-volume
        mountPath: /NuScenes-QA/data
  volumes:
    - name: aleena-vqa-volume
      persistentVolumeClaim:
        claimName: aleena-vqa-pvc


